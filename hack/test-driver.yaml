StorageClass:
  FromName: false
  FromExistingClassName: hostpath-csi
SnapshotClass:
  FromName: true
DriverInfo:
  Name: kubevirt.io.hostpath-provisioner
  Capabilities:
    block: false
    controllerExpansion: false
    exec: true
    fsGroup: true
    multipods: true
    nodeExpansion: false
    persistence: true
    singleNodeVolume: true
    snapshotDataSource: true
    topology: true
    capacity: true
  TopologyKeys:
  - topology.hostpath.csi/node
InlineVolumes:
- shared: true

